name: CI Pipeline

on:
  push:
    branches:
      - main
      - update
  pull_request:
    branches:
      - main
      - update

jobs:
  python-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-api/requirements.txt

      - name: Install Local Agent Dependencies
        run: |
          pip install -r local-agent/requirements.txt

      - name: Install Attribution Engine Dependencies
        run: |
          pip install -r attribution-engine/requirements.txt

      - name: Validate Python Syntax
        run: |
          python -m compileall backend-api
          python -m compileall local-agent
          python -m compileall attribution-engine

  dashboard-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dashboard Dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build Dashboard
        working-directory: dashboard
        run: npm run build

  extension-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Extension Manifest
        run: test -f browser-extension/manifest.json

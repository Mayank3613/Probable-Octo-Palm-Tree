<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OctoPlamTree Extension Tests</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0a0e17; color: #e2e8f0; padding: 20px; }
    h1 { background: linear-gradient(90deg, #6366f1, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .test-result { margin: 8px 0; padding: 12px; border-radius: 6px; background: #111827; border: 1px solid #1e293b; }
    .test-result.pass { border-left: 4px solid #10b981; }
    .test-result.fail { border-left: 4px solid #ef4444; }
    .test-name { font-weight: bold; margin-bottom: 4px; }
    .test-msg { font-family: monospace; font-size: 0.9em; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>Extension Automated Tests</h1>
  <div id="results"></div>

  <!-- Mock environment for extension modules -->
  <script>
    // Mock chrome API
    window.chrome = {
      storage: { local: { get: (k, cb) => cb({}), set: (k, cb) => cb && cb() } },
      runtime: { sendMessage: () => {} }
    };
  </script>

  <!-- Load Modules -->
  <script src="modules/url-analyzer.js"></script>
  
  <!-- Test Runner -->
  <script src="tests.js"></script>
</body>
</html>
